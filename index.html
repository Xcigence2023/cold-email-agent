<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Velorah Ignition — AI Outreach Engine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f7f7f5;--bg3:#f0f0ec;
  --text:#1a1a1a;--text2:#6b6b6b;
  --border:#e0e0d8;--border2:#c8c8c0;
  --info-bg:#eff6ff;--info-text:#1d4ed8;--info-border:#bfdbfe;
  --success-bg:#f0fdf4;--success-text:#15803d;--success-border:#bbf7d0;
  --danger-bg:#fff1f2;--danger-text:#be123c;--danger-border:#fecdd3;
  --warn-bg:#fffbeb;--warn-text:#b45309;--warn-border:#fde68a;
  --r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
  --text:#f5f5f0;--text2:#aeaeb2;
  --border:#3a3a3c;--border2:#48484a;
  --info-bg:#1e3a5f;--info-text:#93c5fd;--info-border:#1e40af;
  --success-bg:#14532d;--success-text:#86efac;--success-border:#166534;
  --danger-bg:#4c0519;--danger-text:#fca5a5;--danger-border:#9f1239;
  --warn-bg:#451a03;--warn-text:#fcd34d;--warn-border:#92400e;
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg3);min-height:100vh}
.page{max-width:980px;margin:0 auto;padding:2rem 1.5rem}
.hdr{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
.hdr h1{font-size:22px;font-weight:700;margin-bottom:4px}
.hdr p{font-size:13px;color:var(--text2)}
.step-bar{display:flex;align-items:center;margin-bottom:1.5rem}
.si{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.si.active{color:var(--text);font-weight:600}
.si.done{color:var(--success-text)}
.sn{width:22px;height:22px;border-radius:50%;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--bg);flex-shrink:0}
.si.active .sn{background:var(--info-bg);border-color:var(--info-border);color:var(--info-text)}
.si.done .sn{background:var(--success-bg);border-color:var(--success-border);color:var(--success-text)}
.sdiv{flex:1;height:1px;background:var(--border);margin:0 6px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);padding:1.25rem;margin-top:12px}
.card:first-child{margin-top:0}
input,select,textarea{width:100%;font-size:13px;padding:8px 11px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--info-text);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
textarea{resize:vertical;line-height:1.6}
.btn{cursor:pointer;font-size:13px;font-weight:600;padding:8px 16px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--info-bg);border-color:var(--info-border);color:var(--info-text)}
.btn-primary:hover{opacity:.85}
.btn-danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger-text)}
.btn-success{background:var(--success-bg);border-color:var(--success-border);color:var(--success-text)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:600px){.g2{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lbl{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.bi{background:var(--info-bg);color:var(--info-text)}
.bs{background:var(--success-bg);color:var(--success-text)}
.bd{background:var(--danger-bg);color:var(--danger-text)}
.bg{background:var(--bg2);color:var(--text2)}
.stat-card{background:var(--bg2);border-radius:var(--r);padding:14px;text-align:center;border:1px solid var(--border)}
.stat-val{font-size:26px;font-weight:700;line-height:1}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:5px}
.drop-zone{border:2px dashed var(--border2);border-radius:var(--rl);padding:3rem 2rem;text-align:center;cursor:pointer;transition:all .15s;margin-top:12px}
.drop-zone:hover,.drop-zone.over{border-color:var(--info-text);background:var(--info-bg)}
.tip{font-size:12px;color:var(--text2);padding:10px 14px;background:var(--bg2);border-radius:var(--r);border-left:3px solid var(--info-border);line-height:1.6;margin-top:10px}
.tip a{color:var(--info-text)}
.errtip{font-size:12px;color:var(--danger-text);padding:10px 14px;background:var(--danger-bg);border-radius:var(--r);border-left:3px solid var(--danger-border);line-height:1.6;margin-top:10px}
.pbar{height:6px;border-radius:3px;background:var(--bg3);overflow:hidden;margin-top:8px}
.pfill{height:100%;background:var(--info-text);border-radius:3px;transition:width .3s}
.email-panel{display:grid;grid-template-columns:270px 1fr;gap:1rem;align-items:start}
@media(max-width:700px){.email-panel{grid-template-columns:1fr}}
.lead-list{border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.ll-hdr{padding:9px 12px;font-size:12px;font-weight:700;color:var(--text2);border-bottom:1px solid var(--border);background:var(--bg2)}
.ll-body{max-height:520px;overflow-y:auto}
.lr{display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
.lr:last-child{border-bottom:none}
.lr:hover{background:var(--bg2)}
.lr.active{background:var(--info-bg)}
.la{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:var(--bg3);color:var(--text2)}
.lr.active .la{background:var(--bg);color:var(--info-text)}
.email-detail{border:1px solid var(--border);border-radius:var(--rl);padding:1.25rem;display:flex;flex-direction:column;gap:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--info-text);border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.srow{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:var(--r);border:1px solid var(--border);gap:8px;margin-bottom:8px}
.sec{font-size:15px;font-weight:700;margin-bottom:14px}
h2{font-size:16px;font-weight:700}
.sub{font-size:13px;color:var(--text2);margin-top:4px}
.mt{margin-top:12px}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <h1>⚡ Velorah Ignition — AI Outreach Engine</h1>
    <p>Upload leads → AI generates personalized emails → Review → Send</p>
  </div>
  <div id="root"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/email-template.js"></script>
<script>
// ── STATE ───────────────────────────────────────────────────
const S={
  step:0,leads:[],headers:[],
  colMap:{email:'',fullName:'',firstName:'',lastName:'',company:'',title:'',industry:'',companySize:'',revenue:''},
  sender:{name:'',email:'',title:'',company:'Velorah'},
  emails:[],genProgress:0,activeIdx:0,sendStatus:{},dragOver:false,
  attachments:[],
  emailAngle:'pain',
  researchMode:false
};
S.signedIn=false;
S.lastSendError='';
S.tpl=window.VelorahEmailTemplate?VelorahEmailTemplate.loadSettings():{enabled:false,ai:true,cfg:null};

// ── CSV ─────────────────────────────────────────────────────
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return{headers:[],rows:[]};
  const pr=line=>{
    const r=[];let c='';let q=false;
    for(const ch of line){
      if(ch==='"'){q=!q;}else if(ch===','&&!q){r.push(c.trim());c='';}else c+=ch;
    }
    r.push(c.trim());return r;
  };
  const headers=pr(lines[0]);
  const rows=lines.slice(1).filter(l=>l.trim()).map(l=>{
    const v=pr(l);const o={};headers.forEach((h,i)=>o[h]=v[i]||'');return o;
  });
  return{headers,rows};
}
function autoMap(headers){
  const map={email:'',fullName:'',firstName:'',lastName:'',company:'',title:'',industry:''};
  const v={email:['email','e-mail','mail'],fullName:['full name','fullname','contact name','name'],firstName:['first name','firstname','first','given'],lastName:['last name','lastname','surname','family'],company:['company','organization','org','account','employer','business'],title:['title','job title','position','role'],industry:['industry','sector','vertical','market']};
  headers.forEach(h=>{
    const hl=h.toLowerCase().trim();
    Object.entries(v).forEach(([k,vs])=>{if(!map[k]&&vs.some(vv=>hl===vv||hl.includes(vv)))map[k]=h;});
  });
  return map;
}
function getName(lead){
  return(lead[S.colMap.fullName]||((lead[S.colMap.firstName]||'')+' '+(lead[S.colMap.lastName]||'')).trim()||lead[S.colMap.email]||'Unknown').trim();
}

// ── AI CALL via proxy ───────────────────────────────────────
function getSystem(angle,companySize,revenue){
const angleInstructions={
  pain:"EMAIL ANGLE: PAIN-FOCUSED. Open by naming their single most pressing growth bottleneck — could be reps burning hours on manual prospecting, inconsistent outbound because there's no real system, or a tool stack so fragmented nothing talks to each other. Make them feel the real cost before introducing the solution. Never lead with just a feature name.",
  roi:"EMAIL ANGLE: ROI-FOCUSED. Lead with the financial reality — most teams run five separate tools just to find, write to, send to, call, and close a lead, and pay for all five separately. Show how Velorah consolidates that into one platform at roughly 60% lower cost than a typical tool stack, while reps have up to 10x more conversations.",
  risk:"EMAIL ANGLE: COMPETITIVE-RISK-FOCUSED. Open with the real business consequence of a slow or inconsistent outbound motion — deals going to whichever vendor responded first, pipeline drying up when a single SDR is out sick, growth capped by headcount instead of demand. Frame a fragmented outbound stack as a growth risk, not just an inconvenience.",
  proof:"EMAIL ANGLE: SOCIAL PROOF. Reference how similar teams in their industry consolidated their outbound stack and saw more conversations per rep with less manual busywork. Focus on business outcomes — more meetings booked, faster time to first outbound campaign, less tool-switching.",
  question:"EMAIL ANGLE: QUESTION-BASED. Open with one sharp business question — not a technical one. Something like: 'If a rep left tomorrow, how much of your pipeline goes with them?' Make it visceral and real before connecting to Velorah.",
  insight:"EMAIL ANGLE: INSIGHT-LED. Open with a surprising insight about outbound sales — how most teams' real bottleneck isn't lead volume but the five-tool handoff between finding, writing to, sending to, calling, and tracking a lead. Connect the dots between tool fragmentation and lost pipeline."
};
const angleText=angleInstructions[angle]||angleInstructions.pain;
return "You are an expert B2B sales copywriter for an AI-powered sales and marketing platform. You write emails that connect outbound sales pain to real business outcomes — not just feature lists. Write emails that land in the inbox, not spam.\n\n"+angleText+"\n\nPRODUCT: Velorah — Your AI Growth Team, In One Platform\n\nWHAT VELORAH DOES:\n- Find: automatically discovers and enriches ideal-fit B2B buyers, so reps stop manually building lead lists\n- Write: AI drafts personalized outreach in the sender's own voice, not a generic template\n- Send: tracked email campaigns with real delivery and reply-rate visibility\n- Call: consent-first AI and human voice calling — every call is disclosed and opted-in, fully compliant (TCPA, CRTC, CASL, GDPR)\n- Close: a built-in CRM keeps every deal moving with nothing falling through the cracks\n- All five stages run as one continuous system instead of five disconnected tools\n\nBUSINESS IMPACT ANGLES TO USE (pick what fits the lead — these are Velorah's real, published numbers, do not invent additional statistics):\n- Teams using Velorah see up to 10x more conversations per rep\n- Roughly 60% lower cost than running a typical five-tool outbound stack\n- Replaces about five separate point tools with one platform\n- Teams can be live and running campaigns in as little as one day\n- Manual prospecting and tool-switching are two of the biggest hidden time costs in outbound sales\n\nINDUSTRY/AUDIENCE FIT (match the framing to who they are — never assume enterprise SaaS by default):\n- B2B SaaS / Tech: tie to pipeline predictability, SDR ramp time, CAC efficiency\n- Agencies: tie to running outbound for multiple clients without multiplying headcount or tool costs\n- Startups / Founders: tie to getting a real outbound motion running without hiring a full sales team first\n- Consultants / Coaches: tie to consistent lead flow without spending their own selling time on manual prospecting\n- Professional services / Recruiting / Real estate: tie to relationship-driven outreach that still scales, without losing the personal touch\n- Established sales orgs replacing a legacy stack: tie to consolidation, cost savings, and reduced tool-switching for reps\n\nROLE-SPECIFIC PAIN POINTS:\n- VP Sales / Sales Director: inconsistent rep output, ramp time for new hires, pipeline coverage gaps\n- Founder/CEO (early stage): no dedicated sales team yet, needs outbound running without a big hire\n- Marketing Director / Demand Gen: handoff friction between marketing-sourced and sales-sourced leads, lead quality\n- RevOps: tool sprawl, broken reporting across five disconnected systems, data living in silos\n- Agency owner: margin pressure from running multiple tools per client account\n- COO/Operations: cost of the current tool stack, vendor management overhead\n\nDELIVERABILITY RULES:\n- NO spam trigger words: free, guarantee, risk-free, act now, limited time, click here, buy now, discount\n- NO all-caps, NO excessive punctuation (!!!, ???)\n- NO more than one URL\n- Write like a senior peer reaching out — not a sales pitch\n- Use recipient first name once naturally in the opening\n- Make the business impact visceral and specific — hours saved, tools consolidated, conversations gained\n- End with: If you would prefer not to hear from me, just reply and I will remove you.\n\nEMAIL STRUCTURE:\n1. Subject: business-outcome focused, under 50 chars, no spam words — avoid leading with just a feature name\n2. Opening: address by first name, immediately connect to a real outbound pain point relevant to their role/industry\n3. Middle: weave together the cost of the current fragmented approach + how Velorah solves it with a specific real stat\n4. CTA: soft ask for a short call or demo to see it on their own pipeline\n5. Sign-off: professional full name and title\n6. Final line: unsubscribe offer\n\nCOMPANY SIZE GUIDANCE (critical — always match stats and language to company size):\nIf company has 1-50 employees: Small business/startup — focus on getting a real outbound motion running without a big sales hire, doing more with a lean team.\nIf company has 51-500 employees: Mid-market — focus on scaling outbound without scaling headcount 1:1, consolidating a growing tool stack.\nIf company has 501-5000 employees: Enterprise — focus on standardizing outbound process across teams, cutting redundant tool spend, and giving leadership pipeline visibility.\nIf company has 5000+ employees: Large enterprise — focus on org-wide consolidation savings, vendor reduction, and consistent compliant calling practices across regions.\nIf company size is unknown: Use neutral language that works across sizes — avoid assuming a large sales team or a big existing budget.\n\nNEVER claim numbers beyond the real ones listed above (10x conversations, 60% lower cost, ~5 tools replaced, live in ~1 day). Do not invent additional statistics, case studies, or customer names. Match the language and stakes precisely to the company's scale.\n\nUnder 180 words total. Every email must feel written by someone who truly understands their business scale and outbound challenges. The goal is to make them think: this person gets exactly what we are dealing with.";
}
const emailRegex=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
async function callAI(lead){
  const name=getName(lead);
  const company=lead[S.colMap.company]||'your company';
  const title=lead[S.colMap.title]||'decision maker';
  const industry=lead[S.colMap.industry]||'technology';
  const companySize=lead[S.colMap.companySize]||'';
  const revenue=lead[S.colMap.revenue]||'';
  const prompt=getSystem(S.emailAngle,companySize,revenue)+tplNote()+'\n\nWrite a cold email to:\n- Name: '+name+'\n- Title: '+title+'\n- Company: '+company+'\n- Industry: '+industry+'\n- Company Size: '+(companySize||'unknown')+'\n- Revenue: '+(revenue||'unknown')+'\n- From: '+S.sender.name+', '+(S.sender.title||'Account Executive')+', '+S.sender.company+'\n\nRespond ONLY with valid JSON, no markdown fences:\n{"subject":"...","body":"..."}';

  const resp=await fetch('/.netlify/functions/generate',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      prompt,
      company,
      industry,
      companySize,
      revenue,
      researchMode:S.researchMode
    })
  });
  const respText=await resp.text();
  if(resp.status===429){
    // Rate limited — wait 10 seconds and retry once
    await new Promise(r=>setTimeout(r,10000));
    const retry=await fetch('/.netlify/functions/generate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt,company,industry,companySize,revenue,researchMode:S.researchMode})
    });
    const retryText=await retry.text();
    if(!retry.ok){
      let errMsg='HTTP '+retry.status+' (after retry)';
      try{const e=JSON.parse(retryText);errMsg=e.error||e.message||JSON.stringify(e);}catch(ex){}
      throw new Error(errMsg);
    }
    const retryData=JSON.parse(retryText);
    if(!retryData.content||!retryData.content[0])throw new Error('Empty retry response');
    const retryTxt=retryData.content[0].text.replace(/```json|```/g,'').trim();
    return JSON.parse(retryTxt);
  }
  if(!resp.ok){
    let errMsg='HTTP '+resp.status;
    try{const e=JSON.parse(respText);errMsg=e.error||e.message||JSON.stringify(e);}catch(ex){}
    throw new Error(errMsg);
  }
  let data;
  try{data=JSON.parse(respText);}catch(e){throw new Error('Invalid server response: '+respText.substring(0,200));}
  if(!data.content||!data.content[0]){throw new Error('Unexpected response structure: '+JSON.stringify(data).substring(0,200));}
  const txt=data.content[0].text.replace(/```json|```/g,'').trim();
  try{return JSON.parse(txt);}catch(e){throw new Error('Could not parse JSON: '+txt.substring(0,200));}
}

// ── SEND EMAIL ──────────────────────────────────────────────
function tplOn(){return !!(S.tpl&&S.tpl.enabled&&window.VelorahEmailTemplate);}
function tplNote(){
  return (tplOn()&&S.tpl.ai)?` TEMPLATE MODE: this email will be placed inside a designed HTML template that already supplies the greeting, the layout, the call-to-action button, the sign-off and the unsubscribe footer. So the "body" you write must be ONLY a short personalised opening of 2 to 3 sentences (maximum 70 words) that refers to this lead's company, role or industry. Do NOT include a greeting, sign-off, signature, links or any unsubscribe line. The subject must still be under 50 characters.`:'';
}

// ── DESIGNED EMAILS ─────────────────────────────────────────
// Designed emails are only sent for signed-in users: the page reads the Supabase session
// (public anon key, same as login.html) and the server verifies it before sending.
const SB_URL='https://cncxqqxwhejcyiiwlqgf.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuY3hxcXh3aGVqY3lpaXdscWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNjY1MzYsImV4cCI6MjA5Mzk0MjUzNn0.pmvjvN9D2sKAiZkgRtIpGX3QRtV9yIB1FFSHqPeuRSI';
let _sb=null;
function sbClient(){if(!_sb&&window.supabase)_sb=window.supabase.createClient(SB_URL,SB_KEY);return _sb;}
async function getSession(){try{const c=sbClient();if(!c)return null;const r=await c.auth.getSession();return(r&&r.data&&r.data.session)||null;}catch(e){return null;}}
async function refreshSession(){const v=!!(await getSession());if(v!==S.signedIn){S.signedIn=v;draw();}return v;}
function leadVars(lead){
  const full=getName(lead);const hasName=full&&full.indexOf('@')<0&&full!=='Unknown';
  const first=(S.colMap.firstName&&lead[S.colMap.firstName])||(hasName?full.split(' ')[0]:'');
  const last=(S.colMap.lastName&&lead[S.colMap.lastName])||(hasName?full.split(' ').slice(1).join(' '):'');
  return{first_name:first,last_name:last,full_name:hasName?full:'',company:lead[S.colMap.company]||'',title:lead[S.colMap.title]||'',industry:lead[S.colMap.industry]||'',email:lead[S.colMap.email]||'',
    sender_name:S.sender.name,sender_title:S.sender.title,sender_company:S.sender.company,sender_email:S.sender.email};
}
function buildDesigned(ed){
  const vars=leadVars(ed.lead);
  if(S.tpl.ai&&ed.body)vars.opening=ed.body;
  const out=VelorahEmailTemplate.build(S.tpl.cfg,vars);
  return{html:out.html,text:out.text,subject:ed.subject||out.subject};
}
async function sendEmail(to,subject,body,ed){
  const payload={to,subject,body,fromEmail:S.sender.email,fromName:S.sender.name,attachments:S.attachments};
  const headers={'Content-Type':'application/json'};
  if(tplOn()&&ed){
    const session=await getSession();
    if(!session){S.signedIn=false;S.lastSendError='Please sign in to send designed emails.';return false;}
    const b=buildDesigned(ed);
    payload.subject=b.subject||subject;payload.body=b.text;payload.bodyHtml=b.html;
    headers.Authorization='Bearer '+session.access_token;
  }
  const resp=await fetch('/.netlify/functions/send',{method:'POST',headers,body:JSON.stringify(payload)});
  const data=await resp.json().catch(()=>({}));
  if(!data.success){console.error('Send error:',data.error);S.lastSendError=data.error||('HTTP '+resp.status);if(data.code==='SEND-AUTH')S.signedIn=false;}
  else S.lastSendError='';
  return data.success===true;
}
async function ensureReadyToSend(isTest){
  if(!tplOn())return true;
  const v=VelorahEmailTemplate.validate(S.tpl.cfg,{needSubject:!S.tpl.ai});
  if(!isTest&&v.errors.length){alert('Fix these before sending:\n\n• '+v.errors.join('\n• ')+'\n\nClick "Edit design" to fix them.');return false;}
  if(!(await refreshSession())){alert('Please sign in to send designed emails.\n\nClick "Sign in" on this page (it opens in a new tab), sign in, then come back and click "I\'ve signed in".');return false;}
  return true;
}
function openDesigner(){
  const first=S.leads[0]?leadVars(S.leads[0]):{};
  VelorahEmailTemplate.openDesigner({cfg:S.tpl.cfg,ai:S.tpl.ai,
    sampleVars:Object.assign({},first.first_name?first:{},{sender_name:S.sender.name||'Your Name',sender_title:S.sender.title||'Your Title',sender_company:S.sender.company,sender_email:S.sender.email||'you@example.com'}),
    sampleOpening:S.tpl.ai?'I noticed your team is growing quickly this quarter, which usually means outbound is about to matter even more.':'',
    onSave:function(cfg){S.tpl.cfg=cfg;VelorahEmailTemplate.saveSettings(S.tpl);draw();}});
}
function previewFrame(ed,height){

function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==='cls')el.className=v;
    else if(k==='html')el.innerHTML=v;
    else if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else if(k.startsWith('on'))el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k,v);
  });
  kids.flat().forEach(c=>{if(c!=null&&c!==false)el.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return el;
}

      const revenue2=lead[S.colMap.revenue]||'';
      const sysPrompt=getSystem(S.emailAngle,companySize2,revenue2);
      const prompt=sysPrompt+tplNote()+'\n\nWrite ONLY the email body (no subject line) for this lead. The body MUST directly follow and expand on this exact subject line:\nSUBJECT: "'+customSubject+'"\n\nThe opening line must connect directly to the subject. Personalize for their industry and role.\n\nLead details:\n- Name: '+name+'\n- Title: '+title+'\n- Company: '+company+'\n- Industry: '+industry+'\n- From: '+S.sender.name+', '+(S.sender.title||'Account Executive')+', '+S.sender.company+'\n\nRespond ONLY with valid JSON, no markdown:\n{"body":"..."}';
      try{
        const resp=await fetch('/.netlify/functions/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt,company:company,industry:industry,researchMode:S.researchMode})});
        const respText=await resp.text();
        const data=JSON.parse(respText);
        // Extract text from content blocks (handles tool-use responses too)
        let txt='';
        if(data.content&&Array.isArray(data.content)){
          for(const block of data.content){if(block.type==='text')txt+=block.text;}
        } else if(data.error){throw new Error(data.error.message||JSON.stringify(data.error));}
        txt=txt.replace(/```json|```/g,'').trim();
        const jsonStart=txt.indexOf('{');const jsonEnd=txt.lastIndexOf('}');
        if(jsonStart>=0&&jsonEnd>jsonStart){
          const parsed=JSON.parse(txt.substring(jsonStart,jsonEnd+1));
          S.emails[idx].body=parsed.body||txt;
          S.emails[idx].subject=customSubject;
          S.emails[idx].approved=true;S.emails[idx].error=false;draw();
        }else if(txt.length>20){
          S.emails[idx].body=txt;S.emails[idx].subject=customSubject;
          S.emails[idx].approved=true;draw();
        }else{throw new Error('Could not parse email from response: '+txt.substring(0,100));}
      }catch(e){alert('Rewrite failed: '+e.message);}
      this.disabled=false;this.textContent='Rewrite Body';
    });
    subjRow.appendChild(subjInp);
    subjRow.appendChild(rewriteBtn);
    subjWrap.appendChild(subjRow);
    det.appendChild(subjWrap);
    const ta=document.createElement('textarea');ta.style.minHeight='190px';ta.value=ae.body;ta.addEventListener('input',function(e){S.emails[S.activeIdx].body=e.target.value;});
    if(tplOn()){
      const pf=previewFrame(ae,560);
      if(S.tpl.ai){
        ta.style.minHeight='96px';
        ta.addEventListener('input',function(){pf.srcdoc=buildDesigned(S.emails[S.activeIdx]).html;});
        det.appendChild(h('div',null,h('div',{cls:'lbl'},'Personalised opening — appears right after the greeting in the designed email'),ta));
      }else{
        det.appendChild(h('div',{cls:'tip',style:{marginTop:'0'}},'Designed template: every recipient gets the same design, personalised with their own details. Change it with "Edit design" on the next step.'));
      }
      det.appendChild(h('div',null,h('div',{cls:'lbl'},'Preview — exactly what this lead will receive'),pf));
    }else{
      det.appendChild(h('div',null,h('div',{cls:'lbl'},'Email body — edit directly or use "Rewrite Body" above to regenerate from your subject'),ta));
    }
    det.appendChild(h('div',{cls:'fb'},
      h('div',{style:{display:'flex',gap:'8px'}},
        h('button',{cls:'btn btn-sm '+(ae.approved&&!ae.error?'btn-danger':'btn-success'),onClick:()=>{S.emails[S.activeIdx].approved=!S.emails[S.activeIdx].approved;draw();}},ae.approved&&!ae.error?'✗ Exclude':'✓ Include'),
        h('button',{cls:'btn btn-sm',onClick:async function(){
          this.disabled=true;this.textContent='Regenerating...';
          try{const{subject,body}=await callAI(ae.lead);S.emails[S.activeIdx].subject=subject;S.emails[S.activeIdx].body=body;S.emails[S.activeIdx].approved=true;S.emails[S.activeIdx].error=false;}
          catch(err){S.emails[S.activeIdx].body='Failed: '+err.message;S.emails[S.activeIdx].error=true;}
          draw();
        }},'↺ Regenerate')
      ),
      h('button',{cls:'btn btn-primary',onClick:()=>{S.step=4;draw();}},'Proceed to Send →')
    ));
  }
  if(tplOn()&&!S.tpl.ai)det.querySelectorAll('button').forEach(b=>{if(/Regenerate|Rewrite Body/.test(b.textContent))b.style.display='none';});
  panel.appendChild(det);wrap.appendChild(panel);
  return wrap;
}

// ── PAGE 4: SEND ─────────────────────────────────────────────
function p4(){
  const wrap=h('div',null);
  const approved=S.emails.filter(e=>e.approved&&!e.error);
  const sent=Object.values(S.sendStatus).filter(s=>s==='sent').length;
  const failed=Object.values(S.sendStatus).filter(s=>s==='error').length;

  const g4=h('div',{cls:'g4',style:{marginBottom:'14px'}});
  [{v:approved.length,l:'Approved'},{v:sent,l:'Sent'},{v:failed,l:'Failed'},{v:approved.length-sent-failed,l:'Pending'}].forEach(s=>{
    g4.appendChild(h('div',{cls:'stat-card'},h('div',{cls:'stat-val'},String(s.v)),h('div',{cls:'stat-lbl'},s.l)));
  });
  wrap.appendChild(g4);
  if(tplOn())wrap.appendChild(designStatusCard());

  const ac=h('div',{cls:'card'});
  ac.appendChild(h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap'}},
    h('button',{cls:'btn btn-primary',onClick:async()=>{if(await ensureReadyToSend())sendAll(approved);}},'▶ Send All ('+approved.length+')'),
    h('button',{cls:'btn',onClick:doExport},'↓ Export CSV'),
    h('button',{cls:'btn',onClick:()=>{S.step=3;draw();}},'← Edit Emails')
  ));
  if(sent>0){
    const pct=Math.round(sent/approved.length*100);
    ac.appendChild(h('div',{style:{marginTop:'10px'}},h('div',{cls:'fb',style:{marginBottom:'4px'}},h('span',{style:{fontSize:'12px',color:'var(--text2)'}},sent+' of '+approved.length+' sent'),h('span',{style:{fontSize:'12px',fontWeight:'700'}},pct+'%')),h('div',{cls:'pbar'},h('div',{cls:'pfill',style:{width:pct+'%'}}))));
  }
  wrap.appendChild(ac);
  if(S.lastSendError&&failed>0)wrap.appendChild(h('div',{cls:'errtip'},'Last error: '+S.lastSendError));

  // Check if email column mapping looks wrong
  const badEmails=approved.filter(e=>!emailRegex.test((e.lead[S.colMap.email]||'').trim()));
  if(badEmails.length>0){
    const warn=h('div',{style:{background:'var(--danger-bg)',border:'1px solid var(--danger-border)',borderRadius:'var(--r)',padding:'14px',marginBottom:'12px',color:'var(--danger-text)'}});
    warn.innerHTML=`<strong>⚠️ Email column mapping issue!</strong><br><br>${badEmails.length} lead(s) have invalid email addresses. The "Email" column in Step 2 may be mapped to the wrong CSV column.<br><br><strong>Example:</strong> "${(badEmails[0].lead[S.colMap.email]||'empty')}" is not a valid email.<br><br>Go back to <strong>Step 2 (Configure)</strong> and re-map the Email column to the correct column in your CSV.`;
    const fixBtn=h('button',{cls:'btn btn-danger',style:{marginTop:'10px'},onClick:()=>{S.step=1;draw();}},'← Fix Column Mapping');
    warn.appendChild(fixBtn);
    wrap.appendChild(warn);
  }

  if(approved.length===0){
    wrap.appendChild(h('div',{cls:'card',style:{textAlign:'center',padding:'2.5rem'}},h('div',{style:{fontSize:'32px',marginBottom:'12px'}},'📭'),h('h2',{style:{marginBottom:'8px'}},'No approved emails'),h('p',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'14px'}},'Go back and mark emails as approved (✓).'),h('button',{cls:'btn btn-primary',onClick:()=>{S.step=3;draw();}},'← Back to Review')));
    return wrap;
  }

  const lc=h('div',{cls:'card'});
  lc.appendChild(h('p',{style:{fontWeight:'700',marginBottom:'14px'}},'Email queue ('+approved.length+' emails)'));
  approved.forEach(ed=>{
    const id=ed.id;const st=S.sendStatus[id];
    const nm=getName(ed.lead).substring(0,28);
    const co=(ed.lead[S.colMap.company]||'').substring(0,24);
    const toEmail=ed.lead[S.colMap.email]||'';
    const row=h('div',{cls:'srow'});
    row.appendChild(h('div',{style:{flex:'1',minWidth:'0'}},
      h('p',{style:{fontWeight:'700',fontSize:'13px'}},nm+(co?' · ':'')+co),
      h('p',{style:{fontSize:'12px',color:'var(--text2)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},ed.subject)
    ));
    row.appendChild(h('span',{style:{fontSize:'12px',color:'var(--text2)',flexShrink:'0',maxWidth:'170px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},toEmail));
    const se=h('div',{style:{flexShrink:'0'}});
    if(st==='sent')se.appendChild(h('span',{cls:'badge bs'},'✓ Sent'));
    else if(st==='error')se.appendChild(h('span',{cls:'badge bd'},'✗ Failed'));
    else if(st==='sending')se.appendChild(h('span',{cls:'spin'}));
    else se.appendChild(h('button',{cls:'btn btn-sm btn-primary',onClick:async function(){
      if(!(await ensureReadyToSend()))return;
      S.sendStatus[id]='sending';draw();
      if(!emailRegex.test(toEmail)){S.sendStatus[id]='error';alert('Invalid email address: "'+toEmail+'"\n\nPlease go back to Step 2 and make sure the Email column is correctly mapped to the email address column in your CSV.');draw();return;}
      try{const ok=await sendEmail(toEmail,ed.subject,ed.body,ed);S.sendStatus[id]=ok?'sent':'error';}catch(e){console.error('Send error:',e.message);S.sendStatus[id]='error';}
      draw();
    }},'Send'));
    
    row.appendChild(se);lc.appendChild(row);
  });
  wrap.appendChild(lc);
  return wrap;
}

async function sendAll(approved){
  
  for(const ed of approved){
    const id=ed.id;if(S.sendStatus[id]==='sent')continue;
    S.sendStatus[id]='sending';draw();
    try{const ok=await sendEmail(ed.lead[S.colMap.email]||'',ed.subject,ed.body,ed);S.sendStatus[id]=ok?'sent':'error';}
    catch{S.sendStatus[id]='error';}
    draw();await new Promise(r=>setTimeout(r,300));
  }
}
function doExport(){
  const approved=S.emails.filter(e=>e.approved&&!e.error);
  if(!approved.length){alert('No approved emails to export.');return;}
  const hdrs=['To Name','To Email','Company','Job Title','Industry','Subject','Body'];
  const csv=[hdrs,...approved.map(e=>[getName(e.lead),e.lead[S.colMap.email]||'',e.lead[S.colMap.company]||'',e.lead[S.colMap.title]||'',e.lead[S.colMap.industry]||'',e.subject,e.body])].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='cold_emails.csv';a.click();
}

draw();
refreshSession();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tplOn())refreshSession();});
</script>
</body>
